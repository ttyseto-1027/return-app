<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服薬履歴 - Return</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:18px 14px 48px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls input,button{font:inherit;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.full{grid-column:1/-1}.back{display:inline-block;margin-bottom:8px;text-decoration:none;color:#111827}.muted{color:#6b7280}.day{border-top:1px solid #e5e7eb;padding:14px 0}.day:first-child{border-top:0}.day h2{font-size:20px;margin:0 0 8px}.day h3{font-size:16px;margin:2px 0;font-weight:600}.summary h3{margin:4px 0;font-size:16px}@media print{.controls,.back{display:none}.app{max-width:none;padding:0}.card{box-shadow:none;border-radius:0}}
</style></head><body><main class="app"><a class="back" href="index.html">← Returnに戻る</a><h1>診察用の服薬履歴</h1><section class="card controls"><label>開始日<input id="from" type="date"></label><label>終了日<input id="to" type="date"></label><button id="show" class="full">この期間を表示</button><button onclick="window.print()" class="full">印刷 / PDF保存</button></section><section class="card summary" id="summary"></section><section class="card" id="days"></section></main><script>
const KEY='return-app-v1';const db=JSON.parse(localStorage.getItem(KEY)||'{}');const pad=n=>String(n).padStart(2,'0');const jpDate=s=>{const d=new Date(s+'T00:00:00');return`${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`};
const fmtTime=iso=>iso?new Date(iso).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'未記録';const fmtDur=ms=>{const m=Math.round(ms/60000),h=Math.floor(m/60),r=m%60;return h?`${h}時間${r}分`:`${r}分`};
function sleepMs(r){let total=0,has=false;if(r?.events?.sleep&&r.events.wake){total+=new Date(r.events.wake)-new Date(r.events.sleep);has=true}if(r?.events?.nap&&r.events.rewake){total+=new Date(r.events.rewake)-new Date(r.events.nap);has=true}return has&&total>=0?total:null}
function lateness(r){if(!r?.events?.arrived)return null;const a=new Date(r.events.arrived),base=new Date(a);base.setHours(14,50,0,0);return Math.max(0,a-base)}
function dateRange(a,b){const out=[];for(let d=new Date(a+'T00:00:00'),e=new Date(b+'T00:00:00');d<=e;d.setDate(d.getDate()+1))out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);return out}
function scheduled(s){const d=new Date(s+'T00:00:00').getDay();return d===2||d===4||d===6}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(){const from=document.getElementById('from').value,to=document.getElementById('to').value;if(!from||!to||from>to)return;const range=dateRange(from,to);let sleep=[],late=[],att=0,scheduledCount=0;range.forEach(k=>{const r=db[k];if(scheduled(k))scheduledCount++;const sm=sleepMs(r);if(sm!==null)sleep.push(sm);const l=lateness(r);if(l!==null){late.push(l);att++}});const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;document.getElementById('summary').innerHTML=`<h2>期間集計</h2><h3>平均睡眠時間　${avg(sleep)===null?'記録なし':fmtDur(avg(sleep))}</h3><h3>平均遅刻時間　${avg(late)===null?'記録なし':fmtDur(avg(late))}</h3><h3>出勤回数／勤務予定回数　${att}回／${scheduledCount}回</h3><h3>欠勤回数　明示記録なし</h3><p class="muted">入力がない日を欠勤とは推定していません。</p>`;
let html='';range.filter(k=>db[k]||scheduled(k)).forEach(k=>{const r=db[k]||{events:{},meds:[]};const meds=r.meds||[];const medTime=meds.length?meds.map(m=>fmtTime(m.time)).join(' / '):'未記録';const medNames=meds.length?meds.map(m=>`${esc(m.drug)} ${esc(m.amount)}`).join(' / '):'未記録';const wake=r.events?.rewake||r.events?.wake;const sleepy=r.sleepiness?['','①','②','③','④','⑤'][r.sleepiness]:'未記録';const arrived=r.events?.arrived;const l=lateness(r);html+=`<article class="day"><h2>${jpDate(k)}</h2><h3>💊 服薬　${medTime}</h3><h3>　${medNames}</h3><h3>⏰ 起床　${fmtTime(wake)}</h3><h3>😴 起床時の眠気　${sleepy}</h3><h3>🚕 出勤　${fmtTime(arrived)}</h3><h3>⏱ 遅刻　${l===null?'未記録':fmtDur(l)}</h3></article>`});document.getElementById('days').innerHTML=html||'<p class="muted">この期間の記録はありません。</p>'}
const keys=Object.keys(db).sort();const today=new Date(),monthAgo=new Date(today);monthAgo.setDate(today.getDate()-30);document.getElementById('from').value=keys[0]||`${monthAgo.getFullYear()}-${pad(monthAgo.getMonth()+1)}-${pad(monthAgo.getDate())}`;document.getElementById('to').value=keys[keys.length-1]||`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;document.getElementById('show').onclick=show;show();
</script></body></html>
